name: Build

# Builds WeatherBar.app on Apple Silicon macOS, checks the bundle, smoke-tests it,
# and uploads a zipped app. Pushing a tag like v1.4 also publishes a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: America/Detroit   # build date stamped into the app is Eastern, matching local builds

jobs:
  build:
    runs-on: macos-26   # Apple Silicon (arm64). Intel is intentionally not supported.
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Read version
        id: meta
        run: |
          v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "WeatherBar version $v"

      - name: Build
        run: ./build.sh

      - name: Verify bundle
        run: |
          APP=build/WeatherBar.app
          plutil -lint "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          lipo -archs "$APP/Contents/MacOS/WeatherBar" | grep -qw arm64
          codesign --verify --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c "Print :WBBuildDate" "$APP/Contents/Info.plist"

      - name: Smoke test (live weather fetch)
        # Network-dependent; reports but does not fail the build if Open-Meteo is unreachable.
        continue-on-error: true
        run: |
          B=build/WeatherBar.app/Contents/MacOS/WeatherBar
          "$B" --once | tee once.txt
          ! grep -q '^ERROR' once.txt
          "$B" --geocode "Novi, MI" | head -3

      - name: Render screenshots
        continue-on-error: true
        run: |
          B=build/WeatherBar.app/Contents/MacOS/WeatherBar
          mkdir -p renders
          "$B" --render renders/dropdown.png
          "$B" --render-settings renders/settings.png
          "$B" --render-about renders/about.png

      - name: Package
        run: ditto -c -k --keepParent build/WeatherBar.app "WeatherBar-${{ steps.meta.outputs.version }}.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WeatherBar-${{ steps.meta.outputs.version }}
          path: WeatherBar-${{ steps.meta.outputs.version }}.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renders
          path: renders/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag must match Info.plist version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ needs.build.outputs.version }}" ]; then
            echo "::error::Tag v$tag does not match Info.plist version ${{ needs.build.outputs.version }}"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WeatherBar-${{ needs.build.outputs.version }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "WeatherBar-${{ needs.build.outputs.version }}.zip" \
            --repo "$GITHUB_REPOSITORY" --title "WeatherBar $GITHUB_REF_NAME" --generate-notes
